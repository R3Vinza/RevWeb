<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader - RevinzaDesigner</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #8b5cf6;
            --secondary: #ec4899;
            --text: #f8fafc;
            --soft: #94a3b8;
            --border: rgba(0,0,0,.3);
            --shadow: rgba(0,0,0,.3);
        }

        [data-theme="light"] {
            --bg: #f5f5f0;
            --card: #ffffff;
            --primary: #8b5cf6;
            --secondary: #ec4899;
            --text: #1a1a1a;
            --soft: #666666;
            --border: rgba(0,0,0,.15);
            --shadow: rgba(0,0,0,.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 40px;
            overflow-x: hidden;
        }

        /* CARDS GAYA DASHBOARD */
        .card-upin {
            background: var(--card);
            border-radius: 24px;
            border: 2px solid var(--border);
            box-shadow: 0 6px 0 var(--shadow), 0 8px 20px var(--shadow);
            transition: .2s;
        }

        /* HEADER GAYA DASHBOARD */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            box-shadow: 0 4px 15px rgba(139,92,246,.3);
            overflow: hidden;
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-text h1 { font-size: 20px; font-weight: 800; }
        .brand-text p { font-size: 12px; color: var(--soft); }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .action-btn {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            border: 2px solid var(--border);
            background: var(--card);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--shadow), 0 8px 20px var(--shadow);
            transition: .2s;
            text-decoration: none;
        }

        .action-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 var(--shadow), 0 2px 5px var(--shadow);
        }

        .action-btn.status {
            width: auto;
            height: 26px;
            padding: 0 10px;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #22c55e;
            border-radius: 8px;
            box-shadow: none;
            pointer-events: none;
            transform: none;
        }

        .theme-btn {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,.3);
            transition: .2s;
        }

        .theme-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,.3);
        }

        /* SECTION TITLE */
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 25px 20px 15px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--secondary);
        }

        /* INPUT AREA */
        .container-box {
            padding: 0 20px;
            margin-bottom: 20px;
        }

        .input-card {
            padding: 22px;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-field {
            width: 100%;
            background: var(--bg);
            border: 2px solid var(--border);
            padding: 16px 20px;
            padding-right: 50px;
            border-radius: 16px;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: 0.3s;
        }

        .input-field:focus {
            border-color: var(--primary);
        }

        .input-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--soft);
            font-size: 18px;
        }

        /* BUTTON STYLE */
        .btn-process {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: 2px solid var(--border);
            color: white;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--shadow);
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-process:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 var(--shadow);
        }

        .btn-process:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 5px 0 var(--shadow);
        }

        /* LOADER GAYA DASHBOARD */
        .loader-wrapper {
            display: none;
            text-align: center;
            padding: 30px 20px;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--primary);
            border-bottom: 4px solid var(--secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 14px;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1px;
        }

        /* RESULT AREA */
        .result-card {
            display: none;
            padding: 22px;
            animation: fade .3s ease;
        }
        @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

        .video-container {
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 18px;
            background: #000;
            border: 2px solid var(--border);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .video-player {
            width: 100%;
            display: block;
            max-height: 380px;
            object-fit: contain;
        }

        .video-info {
            margin-bottom: 20px;
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            color: var(--primary);
            font-weight: 700;
            font-size: 15px;
        }

        .video-caption {
            font-size: 13px;
            color: var(--soft);
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: var(--bg);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-item {
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
        }

        .stat-item i {
            color: var(--secondary);
            margin-right: 4px;
        }

        /* ACTION DOWNLOAD BUTTONS GRID-2 */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn-download {
            background: var(--card);
            border: 2px solid var(--border);
            color: var(--text);
            padding: 14px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 0 var(--shadow);
            transition: 0.2s;
            text-align: center;
        }

        .btn-download:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--shadow);
        }

        .btn-download i {
            font-size: 18px;
            color: var(--primary);
        }

        /* RESET BUTTON GAYA EMBOSS RED */
        .btn-reset {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            border: 2px solid var(--border);
            color: white;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            box-shadow: 0 4px 0 var(--shadow);
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-reset:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--shadow);
        }

        /* TOAST NOTIFIKASI */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            color: var(--text);
            padding: 12px 20px;
            border-radius: 14px;
            font-weight: 700;
            z-index: 9999;
            border: 2px solid var(--border);
            box-shadow: 0 6px 20px var(--shadow);
            animation: slideIn 0.3s ease-out;
            text-align: center;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @keyframes slideIn {
            from { transform: translateX(-50%) translateY(-20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(-50%) translateY(0); opacity: 1; }
            to { transform: translateX(-50%) translateY(-20px); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <a href="/" class="action-btn" title="Kembali ke Dashboard">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="brand">
                <div class="brand-logo">
                    <i class="fab fa-tiktok"></i>
                </div>
                <div class="brand-text">
                    <h1>TikTok DL</h1>
                    <p>Downloader Premium</p>
                </div>
            </div>
        </div>
        <div class="header-right">
            <button class="theme-btn" onclick="toggleTheme()" title="Ganti Tema">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
            <div class="action-btn status"><i class="fa-solid fa-shield-halved"></i><span>USER</span></div>
        </div>
    </div>

    <div class="section-title"><i class="fa-solid fa-link"></i> Tempel URL TikTok</div>
    
    <div class="container-box">
        <div class="input-card card-upin">
            <div class="input-group">
                <input type="text" id="urlInput" class="input-field" placeholder="Masukkan link video TikTok di sini...">
                <i class="fas fa-link input-icon"></i>
            </div>
            <button id="processBtn" class="btn-process">
                <i class="fas fa-bolt"></i> DOWNLOAD SEKARANG
            </button>
        </div>
    </div>

    <div id="loader" class="loader-wrapper">
        <div class="spinner"></div>
        <div class="loader-text">MENGAMBIL DATA TIKTOK...</div>
    </div>

    <div class="container-box">
        <div id="resultCard" class="result-card card-upin">
            <div class="video-container">
                <video id="videoPreview" class="video-player" controls autoplay loop muted></video>
            </div>

            <div class="video-info">
                <div class="author-info">
                    <i class="fas fa-user-circle"></i>
                    <span id="authorName">@username</span>
                </div>
                <div class="video-caption" id="videoCaption">Deskripsi video...</div>

                <div class="stats-row">
                    <div class="stat-item"><i class="fas fa-heart"></i> <span id="likeCount">0</span></div>
                    <div class="stat-item"><i class="fas fa-comment"></i> <span id="commentCount">0</span></div>
                    <div class="stat-item"><i class="fas fa-share"></i> <span id="shareCount">0</span></div>
                </div>
            </div>

            <div class="action-buttons">
                <a href="#" id="dlVideo" class="btn-download" target="_blank">
                    <i class="fas fa-video"></i>
                    <span>VIDEO (NO WM)</span>
                </a>
                <a href="#" id="dlAudio" class="btn-download" target="_blank">
                    <i class="fas fa-music"></i>
                    <span>AUDIO MP3</span>
                </a>
            </div>

            <button onclick="resetApp()" class="btn-reset">
                <i class="fas fa-trash"></i> RESET FORM
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();

            const processBtn = document.getElementById('processBtn');
            const urlInput = document.getElementById('urlInput');
            const loader = document.getElementById('loader');
            const resultCard = document.getElementById('resultCard');

            // Output Elements
            const videoPreview = document.getElementById('videoPreview');
            const authorName = document.getElementById('authorName');
            const videoCaption = document.getElementById('videoCaption');
            const likeCount = document.getElementById('likeCount');
            const commentCount = document.getElementById('commentCount');
            const shareCount = document.getElementById('shareCount');
            const dlVideo = document.getElementById('dlVideo');
            const dlAudio = document.getElementById('dlAudio');

            // Show Custom Dashboard Notification
            function showNotification(message, icon = "🚀") {
                const notification = document.createElement('div');
                notification.className = 'notification';
                notification.innerHTML = `<span>${icon}</span> ${message}`;
                document.body.appendChild(notification);

                setTimeout(() => {
                    notification.style.animation = 'slideOut 0.3s ease-out';
                    setTimeout(() => {
                        if (notification.parentNode) {
                            document.body.removeChild(notification);
                        }
                    }, 300);
                }, 2000);
            }

            processBtn.addEventListener('click', async () => {
                const url = urlInput.value.trim();
                if (!url) {
                    showNotification("Masukkan URL TikTok terlebih dahulu!", "⚠️");
                    return;
                }

                if (!url.includes('tiktok.com') && !url.includes('vt.tiktok.com')) {
                    showNotification("Masukkan URL TikTok yang valid!", "❌");
                    return;
                }

                // Reset Tampilan
                resultCard.style.display = 'none';
                loader.style.display = 'block';
                processBtn.disabled = true;
                processBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> MEMPROSES...';
                videoPreview.pause();
                videoPreview.src = "";

                try {
                    const apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`;
                    const response = await fetch(apiUrl);
                    const data = await response.json();

                    if (data.code === 0) {
                        const info = data.data;

                        // Pasang data ke komponen
                        authorName.textContent = '@' + info.author.unique_id;
                        videoCaption.textContent = info.title || "Tidak ada deskripsi";
                        likeCount.textContent = formatStats(info.digg_count || 0);
                        commentCount.textContent = formatStats(info.comment_count || 0);
                        shareCount.textContent = formatStats(info.share_count || 0);

                        // Pasang file download & stream
                        videoPreview.src = info.play; 
                        dlVideo.href = info.play;
                        dlAudio.href = info.music || '#';

                        // Tampilkan hasil
                        loader.style.display = 'none';
                        resultCard.style.display = 'block';
                        processBtn.disabled = false;
                        processBtn.innerHTML = '<i class="fas fa-bolt"></i> DOWNLOAD SEKARANG';

                        videoPreview.play().catch(e => console.log("Autoplay diblokir"));
                        showNotification("Data TikTok berhasil didapatkan!", "✅");

                    } else {
                        throw new Error("Video tidak ditemukan.");
                    }

                } catch (err) {
                    loader.style.display = 'none';
                    processBtn.disabled = false;
                    processBtn.innerHTML = '<i class="fas fa-bolt"></i> DOWNLOAD SEKARANG';
                    showNotification("Gagal mengambil data. Coba link lainnya.", "❌");
                    console.error(err);
                }
            });

            function formatStats(num) {
                if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
                if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
                return num;
            }

            window.resetApp = function() {
                urlInput.value = '';
                resultCard.style.display = 'none';
                videoPreview.pause();
                videoPreview.src = "";
                urlInput.focus();
                showNotification("Formulir berhasil direset!", "🧹");
            };

            urlInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    processBtn.click();
                }
            });
        });

        // Theme Sync Functions (Sama persis dengan dashboard)
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            
            const icon = document.getElementById('themeIcon');
            if(icon) icon.className = newTheme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const icon = document.getElementById('themeIcon');
            if(icon) icon.className = savedTheme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        }
    </script>
</body>
</html>
