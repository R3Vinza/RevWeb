<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IQC Generator | By Revinza</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #8b5cf6;
            --secondary: #ec4899;
            --text: #f8fafc;
            --soft: #94a3b8;
            --border: rgba(0,0,0,.3);
            --shadow: rgba(0,0,0,.3);
        }

        [data-theme="light"] {
            --bg: #f5f5f0;
            --card: #ffffff;
            --primary: #8b5cf6;
            --secondary: #ec4899;
            --text: #1a1a1a;
            --soft: #666666;
            --border: rgba(0,0,0,.15);
            --shadow: rgba(0,0,0,.15);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            outline: none; user-select: none;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start;
            overflow: hidden;
        }

        /* APP FRAME STRUCTURE */
        .app-frame {
            width: 100%; max-width: 480px; height: 100vh;
            background: var(--bg);
            position: relative; display: flex; flex-direction: column;
            overflow: hidden;
        }

        @media(min-width: 500px) {
            body { align-items: center; padding: 20px 0; }
            .app-frame { 
                height: 92vh; 
                border-radius: 32px; 
                border: 3px solid var(--border); 
                box-shadow: 0 12px 0 var(--shadow), 0 20px 30px var(--shadow);
            }
        }

        /* HEADER GAYA DASHBOARD */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--bg);
            border-bottom: 2px solid var(--border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-title {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .brand-title span {
            color: var(--secondary);
        }

        .action-btn {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            border: 2px solid var(--border);
            background: var(--card);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--shadow);
            transition: .2s;
            text-decoration: none;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--shadow);
        }

        .theme-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 2px solid var(--border);
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 3px 0 rgba(0,0,0,.3);
            transition: .2s;
            margin-right: 8px;
        }
        .theme-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 rgba(0,0,0,.3);
        }

        /* CONTENT LAYER */
        .content-area {
            flex: 1; overflow-y: auto; padding: 20px;
            scrollbar-width: none;
        }
        .content-area::-webkit-scrollbar { display: none; }

        /* CARDS GAYA DASHBOARD */
        .card-upin {
            background: var(--card);
            border-radius: 24px;
            border: 2px solid var(--border);
            box-shadow: 0 5px 0 var(--shadow), 0 8px 20px var(--shadow);
            margin-bottom: 20px;
            padding: 20px;
            transition: .2s;
        }

        .profile-section {
            display: flex; align-items: center; gap: 14px;
        }
        .p-img {
            width: 52px; height: 52px; border-radius: 16px; border: 2px solid var(--border);
            object-fit: cover; box-shadow: 0 3px 0 var(--shadow);
        }
        .p-info h2 { font-size: 16px; font-weight: 800; color: var(--text); margin-bottom: 2px; }
        .p-info p { font-size: 11px; color: var(--soft); display: flex; align-items: center; gap: 5px; font-weight: 600; }
        .status-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; }

        /* SLIDER COMPONENT */
        .ad-slider {
            position: relative; width: 100%; height: 120px;
            border-radius: 18px; overflow: hidden; margin-bottom: 20px;
            border: 2px solid var(--border); box-shadow: 0 4px 0 var(--shadow);
        }
        .ad-slide { position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 0.5s ease; }
        .ad-slide.active { opacity: 1; }
        .ad-slide img { width: 100%; height: 100%; object-fit: cover; }

        /* MARQUEE TEXT INFO */
        .marquee-container {
            background: var(--card); border-radius: 12px; overflow: hidden; white-space: nowrap;
            padding: 8px; margin-bottom: 20px; border: 2px solid var(--border); border-left: 5px solid var(--primary);
        }
        .marquee-text {
            display: inline-block; padding-left: 100%; animation: marquee 15s linear infinite;
            font-size: 11px; color: var(--soft); font-weight: 600;
        }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* INPUT AREA FORM COMPONENTS */
        .input-group { margin-bottom: 16px; }
        .input-group label {
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; font-weight: 700; margin-bottom: 8px;
            color: var(--secondary); text-transform: uppercase; letter-spacing: 0.5px;
        }
        .input-group input {
            width: 100%; padding: 14px 16px;
            background: var(--bg); border: 2px solid var(--border);
            border-radius: 14px; color: var(--text); font-size: 14px; font-weight: 600;
            transition: 0.2s;
        }
        .input-group input:focus { border-color: var(--primary); }

        /* PROVIDER BADGE BUTTONS */
        .provider-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
        .provider-btn {
            padding: 8px 14px; background: var(--bg); border: 2px solid var(--border); border-radius: 12px;
            color: var(--soft); font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s;
            box-shadow: 0 3px 0 var(--shadow);
        }
        .provider-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
        .provider-btn.active { background: var(--primary); color: white; border-color: var(--border); }

        /* GENERATE PROCESS BUTTON */
        .generate-btn {
            width: 100%; padding: 16px; background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: 2px solid var(--border); border-radius: 16px; color: white; font-weight: 800;
            font-size: 14px; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: center; 
            gap: 8px; cursor: pointer; box-shadow: 0 5px 0 var(--shadow); transition: 0.2s;
        }
        .generate-btn:active { transform: translateY(5px); box-shadow: 0 0 0 var(--shadow); }

        /* RESULT VIEWBOX AREA */
        .iqc-preview {
            background: #000; border-radius: 16px; min-height: 180px;
            display: flex; align-items: center; justify-content: center; margin-bottom: 16px; 
            overflow: hidden; border: 2px solid var(--border);
        }
        .iqc-preview img { width: 100%; max-height: 350px; object-fit: contain; }

        .download-btn { 
            width: 100%; padding: 14px; background: linear-gradient(135deg, #10b981, #059669); 
            border: 2px solid var(--border); border-radius: 14px; color: white; font-weight: 800; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; 
            box-shadow: 0 4px 0 var(--shadow); transition: 0.2s;
        }
        .download-btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--shadow); }

        /* BOTTOM NAV SHEET & PANEL DRAWER */
        .menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s;
            backdrop-filter: blur(4px);
        }
        .menu-overlay.active { opacity: 1; pointer-events: auto; }
        
        .menu-panel {
            position: absolute; top: 0; right: 0; width: 75%; height: 100%;
            background: var(--card); transform: translateX(100%); transition: 0.3s; padding: 24px;
            border-left: 3px solid var(--border); box-shadow: -10px 0 30px rgba(0,0,0,0.2);
        }
        .menu-overlay.active .menu-panel { transform: translateX(0); }

        .menu-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;
        }
        .menu-header h3 { font-weight: 800; color: var(--secondary); font-size: 18px; }

        .menu-item {
            cursor: pointer; padding: 14px; border: 2px solid var(--border); border-radius: 14px;
            background: var(--bg); margin-bottom: 12px; box-shadow: 0 3px 0 var(--shadow); transition: 0.2s;
        }
        .menu-item:active { transform: translateY(3px); box-shadow: 0 0 0 var(--shadow); }
        .menu-item h4 { font-size: 14px; font-weight: 800; margin-bottom: 2px; }
        .menu-item p { font-size: 11px; color: var(--soft); font-weight: 600; }

        /* TOAST NOTIFIKASI GAYA DASHBOARD */
        .notification {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--card); color: var(--text); padding: 12px 20px; border-radius: 14px;
            font-weight: 700; z-index: 9999; border: 2px solid var(--border); box-shadow: 0 6px 20px var(--shadow);
            animation: slideIn 0.3s ease-out; text-align: center; font-size: 13px; display: flex; align-items: center; gap: 8px;
        }
        @keyframes slideIn { from { transform: translateX(-50%) translateY(-20px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(-50%) translateY(0); opacity: 1; } to { transform: translateX(-50%) translateY(-20px); opacity: 0; } }

        .spin { animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="app-frame">
        <div class="header-area">
            <div class="header-left">
                <a href="/" class="action-btn" title="Dashboard">
                    <i class="ri-arrow-left-line"></i>
                </a>
                <div class="brand-title">IQC<span>GENERATOR</span></div>
            </div>
            <div style="display: flex; align-items: center;">
                <button class="theme-btn" onclick="toggleTheme()" title="Ganti Tema">
                    <i class="ri-moon-line" id="themeIcon"></i>
                </button>
                <div class="action-btn" id="btnMenu">
                    <i class="ri-menu-3-line"></i>
                </div>
            </div>
        </div>

        <div class="content-area" id="mainContent">
            
            <div class="card-upin profile-section">
                <img src="https://files.catbox.moe/9u1xpa.jpg" class="p-img">
                <div class="p-info">
                    <h2 id="userName"></h2>
                    <p><span class="status-dot"></span> Server Online</p>
                </div>
            </div>

            <div class="ad-slider" id="adSlider"></div>

            <div class="marquee-container">
                <div class="marquee-text">IQC Generator • Buat tampilan mock IQC keren dengan mudah • Pilih provider & kustomisasi sesukamu • Unduh hasilnya instan!</div>
            </div>

            <div class="card-upin">
                <div class="input-group">
                    <label><i class="ri-text-line"></i> Teks Pesan</label>
                    <input type="text" id="textInput" value="Hai">
                </div>

                <div class="input-group">
                    <label><i class="ri-wifi-line"></i> Operator Provider</label>
                    <div class="provider-buttons" id="providerButtons">
                        <button class="provider-btn active" data-provider="Axis">Axis</button>
                        <button class="provider-btn" data-provider="Telkomsel">Telkomsel</button>
                        <button class="provider-btn" data-provider="Indosat">Indosat</button>
                        <button class="provider-btn" data-provider="XL">XL</button>
                        <button class="provider-btn" data-provider="Three">Three</button>
                    </div>
                </div>

                <div style="display:flex; gap:12px; margin-bottom:20px;">
                    <div class="input-group" style="flex:1;">
                        <label>Jam</label>
                        <input type="number" id="jamInput" value="11">
                    </div>
                    <div class="input-group" style="flex:1;">
                        <label>Baterai (%)</label>
                        <input type="number" id="bateraiInput" value="90">
                    </div>
                </div>

                <button class="generate-btn" id="generateBtn">
                    <i class="ri-flashlight-fill"></i> GENERATE IQC NOW
                </button>
            </div>

            <div class="card-upin" id="resultCard" style="display: none;">
                <div class="iqc-preview" id="iqcPreview"></div>
                <button class="download-btn" id="downloadBtn">
                    <i class="ri-download-2-line"></i> DOWNLOAD IMAGE
                </button>
            </div>
        </div>
    </div>

    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-panel">
            <div class="menu-header">
                <h3>Shortcut Menu</h3>
                <div id="menuClose" class="action-btn" style="width:36px; height:36px; border-radius:10px;"><i class="ri-close-line"></i></div>
            </div>
            <div class="menu-item" onclick="window.location.href='/ai'">
                <h4>Chat AI</h4>
                <p>Mau obrolan seru bareng AkiraAI?</p>
            </div>
        </div>
    </div>

    <script>
        let currentImageUrl = '';
        let currentProvider = 'Axis';
        const adBanners = ["https://files.catbox.moe/lgc3gb.jpeg", "https://files.catbox.moe/tlcfw5.jpg", "https://files.catbox.moe/inrytu.jpg"];

        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            typeWriter(); 
            initSlider();
        });

        // Typewriter Effect title
        const txtName = "IQC TOOLS PREMIUM";
        let idx = 0;
        function typeWriter() {
            if (idx < txtName.length) {
                document.getElementById('userName').innerHTML += txtName.charAt(idx);
                idx++;
                setTimeout(typeWriter, 80);
            }
        }

        // Dashboard Ads Engine Image Banner Slider
        function initSlider() {
            const slider = document.getElementById('adSlider');
            adBanners.forEach((url, i) => {
                const div = document.createElement('div');
                div.className = `ad-slide ${i===0?'active':''}`;
                div.innerHTML = `<img src="${url}">`;
                slider.appendChild(div);
            });
            let cur = 0;
            setInterval(() => {
                const slides = document.querySelectorAll('.ad-slide');
                if(slides.length > 0) {
                    slides[cur].classList.remove('active');
                    cur = (cur + 1) % slides.length;
                    slides[cur].classList.add('active');
                }
            }, 4000);
        }

        // Custom Notification Toast Display Engine
        function showNotification(message, icon = "🚀") {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.innerHTML = `<span>${icon}</span> ${message}`;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease-out';
                setTimeout(() => {
                    if (notification.parentNode) {
                        document.body.removeChild(notification);
                    }
                }, 300);
            }, 2000);
        }

        // Interactive Provider Grid click events listeners
        document.querySelectorAll('.provider-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.provider-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentProvider = btn.dataset.provider;
            }
        });

        // Request Process Core Core Engine
        document.getElementById('generateBtn').onclick = async () => {
            const text = document.getElementById('textInput').value;
            const jam = document.getElementById('jamInput').value;
            const bat = document.getElementById('bateraiInput').value;
            const preview = document.getElementById('iqcPreview');
            const generateBtn = document.getElementById('generateBtn');
            
            if(!text) {
                showNotification("Teks pesan tidak boleh kosong!", "⚠️");
                return;
            }

            document.getElementById('resultCard').style.display = 'block';
            preview.innerHTML = '<i class="ri-loader-4-line spin" style="font-size:32px; color:var(--primary);"></i>';
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<i class="ri-loader-4-line spin"></i> MEMPROSES...';

            try {
                const res = await fetch(`https://api.nexray.eu.cc/maker/v1/iqc?text=${encodeURIComponent(text)}&provider=${currentProvider}&jam=${jam}&baterai=${bat}`);
                const blob = await res.blob();
                currentImageUrl = URL.createObjectURL(blob);
                preview.innerHTML = `<img src="${currentImageUrl}">`;
                showNotification("IQC Berhasil di-generate!", "✅");
            } catch (e) {
                preview.innerHTML = '<span style="font-weight:700; font-size:13px; color:var(--soft);">Gagal membuat gambar. Coba lagi!</span>';
                showNotification("Terjadi kesalahan jaringan server.", "❌");
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = '<i class="ri-flashlight-fill"></i> GENERATE IQC NOW';
            }
        };

        // Download Binary Output Engine
        document.getElementById('downloadBtn').onclick = () => {
            if(!currentImageUrl) return;
            const a = document.createElement('a');
            a.href = currentImageUrl;
            a.download = 'iqc-result-revinzaDesigner.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showNotification("Gambar berhasil disimpan!", "💾");
        };

        // Navigation Toggle Drawer Controllers
        document.getElementById('btnMenu').onclick = () => document.getElementById('menuOverlay').classList.add('active');
        document.getElementById('menuClose').onclick = () => document.getElementById('menuOverlay').classList.remove('active');
        document.getElementById('menuOverlay').onclick = (e) => {
            if(e.target === document.getElementById('menuOverlay')) {
                document.getElementById('menuOverlay').classList.remove('active');
            }
        };

        // Dark Light Global Sync Engine (Sama persis seperti dashboard utama Anda)
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            
            const icon = document.getElementById('themeIcon');
            if(icon) icon.className = newTheme === 'dark' ? 'ri-moon-line' : 'ri-sun-line';
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const icon = document.getElementById('themeIcon');
            if(icon) icon.className = savedTheme === 'dark' ? 'ri-moon-line' : 'ri-sun-line';
        }
    </script>
</body>
</html>
